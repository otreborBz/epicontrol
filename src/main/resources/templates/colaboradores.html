<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />

    <script>
      // Aplica o estado do menu imediatamente para evitar "flicker"
      (function () {
        const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
        if (isCollapsed) {
          document.documentElement.classList.add("sidebar-collapsed");
        }
      })();
    </script>

    <title>Colaboradores - EpiControl</title>
    <link rel="stylesheet" th:href="@{/css/layout-sidebar.css}" />
    <link rel="stylesheet" th:href="@{/css/colaboradores.css}" />
  </head>
  <body>
    <div class="app-container">
      <div
        th:replace="~{fragments/layout :: sidebar(activePage='colaboradores')}"
      ></div>
      <main class="main-content">
        <div class="page-header">
          <h1>Gestão de Colaboradores</h1>
          <button id="open-modal-btn" class="btn btn-primary">
            <i class="fas fa-plus"></i> Novo Colaborador
          </button>
        </div>

        <!-- Tabela de Colaboradores -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>RE</th>
                <th>Setor</th>
                <th>Função</th>
                <th>Admissão</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="colaborador : ${colaboradores}">
                <td th:text="${colaborador.nome}">Nome do Colaborador</td>
                <td th:text="${colaborador.re}">RE do Colaborador</td>
                <td th:text="${colaborador.setor}">Setor do Colaborador</td>
                <td th:text="${colaborador.funcao}">Função do Colaborador</td>
                <td th:text="${colaborador.data_admissao}">Data de Admissão</td>
                <td class="actions">
                  <button
                    type="button"
                    class="edit-button open-edit-modal-btn"
                    th:data-id="${colaborador.id}"
                    title="Editar"
                  >
                    <i class="fas fa-edit"></i>
                  </button>
                  <!-- Botão que abre o modal de exclusão -->
                  <button
                    type="button"
                    class="delete-button open-delete-modal-btn"
                    th:data-id="${colaborador.id}"
                    title="Excluir"
                  >
                    <i class="fas fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Modal para Novo Colaborador -->
    <div id="colaborador-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Novo Colaborador</h2>
          <button id="close-modal-btn" class="close-button">&times;</button>
        </div>
        <form action="/colaboradores" method="post" class="modal-form">
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required />
          </div>
          <div class="form-group">
            <label for="re">RE (Registro do Empregado)</label>
            <input type="text" id="re" name="re" required />
          </div>
          <div class="form-group">
            <label for="data_admissao">Data de Admissão</label>
            <input
              type="date"
              id="data_admissao"
              name="data_admissao"
              required
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="setor">Setor</label>
              <select id="setor" name="setor" required>
                <option value="">Selecione o Setor</option>
                <option value="Produção">Produção</option>
                <option value="Manutenção">Manutenção</option>
                <option value="Logística">Logística</option>
                <option value="Qualidade">Qualidade</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Segurança do Trabalho">
                  Segurança do Trabalho
                </option>
              </select>
            </div>
            <div class="form-group">
              <label for="funcao">Função</label>
              <select id="funcao" name="funcao" required>
                <option value="">Selecione a Função</option>
                <option value="Operador de Máquinas">
                  Operador de Máquinas
                </option>
                <option value="Técnico de Manutenção">
                  Técnico de Manutenção
                </option>
                <option value="Almoxarife">Almoxarife</option>
                <option value="Inspetor de Qualidade">
                  Inspetor de Qualidade
                </option>
                <option value="Analista Administrativo">
                  Analista Administrativo
                </option>
                <option value="Técnico de Segurança">
                  Técnico de Segurança
                </option>
                <option value="Eletricista">Eletricista</option>
                <option value="Mecânico">Mecânico</option>
              </select>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="delete-confirm-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Confirmar Exclusão</h2>
          <button id="close-delete-modal-btn" class="close-button">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <p>Tem certeza que deseja excluir este colaborador?</p>
          <p>Esta ação não pode ser desfeita.</p>
        </div>
        <div class="modal-footer">
          <button id="cancel-delete-btn" class="btn btn-secondary">
            Cancelar
          </button>
          <form
            id="delete-confirm-form"
            th:action="@{/colaboradores/delete}"
            method="post"
          >
            <input
              type="hidden"
              id="colaborador-id-to-delete"
              name="id"
              value=""
            />
            <button
              id="confirm-delete-btn"
              type="submit"
              class="btn btn-danger"
            >
              Excluir
            </button>
          </form>
        </div>
      </div>
    </div>

    <script th:src="@{/js/layout.js}"></script>
    <script th:src="@{/js/colaboradores.js}"></script>
  </body>
</html>
